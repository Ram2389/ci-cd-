name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    # Imposta la cartella di lavoro per tutti i comandi 'run'
    defaults:
      run:
        working-directory: ./ci-cd-

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Il caching velocizza le esecuzioni future
          cache: 'poetry'
          cache-dependency-path: ./ci-cd-/poetry.lock

      - name: Install dependencies
        run: poetry install

      - name: Lint (Ruff)
        run: poetry run ruff check .

      - name: Format check (Ruff)
        run: poetry run ruff format --check .

      - name: Type check (Mypy)
        run: poetry run mypy calculator/

      - name: Test (Pytest)
        run: poetry run pytest tests/ -v

      - name: Build
        run: poetry build
